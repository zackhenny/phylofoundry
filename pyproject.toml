[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phylofoundry"
version = "0.1.0"
description = "A bioinformatic pipeline for competitive HMM analysis, phylogeny, and protein language model embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.24",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
qc = ["matplotlib>=3.7", "scipy>=1.10"]
ha = ["pwlf>=2.2"]
gpu = ["fair-esm", "transformers"]
dev = ["pytest", "ruff", "mypy"]
all = [
  "scikit-bio",
  "scikit-learn",
  "umap-learn",
  "biopython",
  "clinker-vis",
  "pygenomeviz",
  "scipy",
  "rich",
  "phylofoundry[qc,ha,gpu,dev]",
]

[project.scripts]
phylofoundry = "phylofoundry.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
