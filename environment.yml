name: phylofoundry
channels:
  - conda-forge
  - bioconda
  - defaults
  - smirarab
dependencies:
  - python=3.10
  - pip
  - pyyaml
  - pydantic>=2
  - pytest
  - pandas
  - numpy
  - scikit-bio
  - scikit-learn>=1.3
  - umap-learn
  - hmmer
  - mafft
  - clipkit
  - iqtree
  - treeshrink
  - biopython
  - matplotlib
  - scipy
  - diamond
  - mmseqs2
  - hyphy
  - treecluster
  - clinker-py
  - pip:
    - fair-esm
    - transformers
    - torch
    - streamlit
    - bqplot
    - pygenomeviz
    - pwlf
    - -e .  # Install the current package in editable mode
