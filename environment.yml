name: phylofoundry
channels:
  - conda-forge
  - bioconda
  - defaults
  - smirarab
dependencies:
  - python=3.10
  - pandas
  - numpy
  - scikit-bio
  - scikit-learn>=1.3
  - umap-learn
  - hmmer
  - mafft
  - pal2nal
  - clipkit
  - iqtree
  - treeshrink
  - biopython
  - matplotlib
  - scipy
  - diamond
  - mmseqs2
  - hyphy
  - treecluster
  - clinker-py
  - python-igraph
  - leidenalg
  - pip
  - pip:
    - fair-esm
    - transformers
    - torch
    - streamlit
    - bqplot
    - pygenomeviz
    - pwlf
    - .  # Install the current package in editable mode
